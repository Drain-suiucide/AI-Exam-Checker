 [build-system]
 requires = ["hatchling"]
 build-backend = "hatchling.build"

 [project]
 name = "ai-exam-checker-backend"
 version = "0.1.0"
 description = "Backend of AI Exam Checker — research prototype for EGE history evaluated answers"
 readme = "README.md"
 requires-python = ">=3.12"
 license = { text = "MIT" }
 authors = [
   { name = "AI Exam Checker Team" },
 ]
 keywords = ["education", "exam", "evaluator", "fastapi"]
 classifiers = [
   "Framework :: FastAPI",
   "Programming Language :: Python :: 3.12",
 ]
dependencies = [
    "fastapi>=0.115.6,<0.116.0",
    "pydantic>=2.10.4,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "uvicorn[standard]>=0.34.0,<0.35.0",
    "sqlalchemy>=2.0.36,<3.0.0",
    "psycopg[binary]>=3.2.3,<4.0.0",
    "pillow>=13.0.0",
    "pytesseract>=0.3.13",
]

 [project.scripts]
 start = "app.main:main"

 [tool.hatch.build.targets.wheel]
 packages = ["app"]

 [dependency-groups]
 dev = [
   "pytest>=8.3.3",
   "pytest-asyncio>=0.24.0",
   "httpx>=0.27.2",
   "respx>=0.21.1",
 ]

[tool.uv]
default-groups = ["dev"]

 [tool.ruff]
 line-length = 100
 target-version = "py312"
 select = [
   "E", "W",  # pycodestyle
   "F",       # pyflakes
   "I",       # isort
   "N",       # pep8-naming
   "UP",      # pyupgrade
   "TRY",     # tryceratops
   "B",       # flake8-bugbear
   "SIM",     # flake8-simplify
 ]
 ignore = [
   "TRY003",  # long messages in exceptions are acceptable
 ]

 [tool.ruff.per-file-ignores]
 "alembic/versions/*.py" = ["N999"]

 [tool.ruff.isort]
 known-first-party = ["app"]

 [tool.mypy]
 python_version = "3.12"
 strict = true
 warn_return_any = true
 warn_unused_configs = true
 ignore_missing_imports = true
 disallow_untyped_defs = true
 disallow_incomplete_defs = true

 [tool.pytest.ini_options]
 asyncio_default_fixture_loop_scope = "function"
 asyncio_mode = "auto"
 testpaths = ["tests"]

 [tool.coverage.run]
 source = ["app"]
 omit = ["alembic/*"]
