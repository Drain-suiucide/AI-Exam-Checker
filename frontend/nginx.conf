# Каркас nginx для compose (T-005): статика SPA + прокси /api на backend.
# Единый origin — CORS не нужен (ADR-001).
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Динамический resolver compose-сети: nginx не падает, если имя backend
    # ещё не появилось в DNS при старте (ADR-001: один origin).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Кэш хеш-имён ассетов; HTML всегда свежий.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Прокси на backend-сервис compose.
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health-check nginx не должен требовать backend.
    location = /health {
        access_log off;
        return 200 "web ok\n";
    }

    # SPA-fallback: все пути отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
